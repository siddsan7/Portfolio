  <circle cx="88" cy="80" r="10" fill="#38BDF8" fill-opacity="0.7"/>
  <circle cx="122" cy="80" r="10" fill="#34D399" fill-opacity="0.65"/>
  <circle cx="156" cy="80" r="10" fill="#60A5FA" fill-opacity="0.65"/>
  <path d="M100 180H420M100 226H620M100 272H520" stroke="#A7B0C0" stroke-opacity="0.35" stroke-width="18" stroke-linecap="round"/>
