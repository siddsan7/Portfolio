<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/identity.svg" />
    <link
      rel="preload"
      href="/fonts/Karrik-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="theme-color" content="#f6f2ec" />
    <script>
      try {
        var saved = localStorage.theme
      } catch {}
      // A saved choice wins; otherwise follow the system setting.
      if (
        saved === 'dark' ||
        (!saved && matchMedia('(prefers-color-scheme: dark)').matches)
      )
        document.documentElement.dataset.theme = 'dark'
    </script>
    <script type="speculationrules">
      { "prerender": [{ "where": { "href_matches": "/*" }, "eagerness": "moderate" }] }
    </script>
    <!--page-head-->
  </head>
  <body>
    <!--page-body-->
    <script type="module" src="/src/redesign/bootstrap.js"></script>
  </body>
</html>
